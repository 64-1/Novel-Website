<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3a70ff">
  <title>创作者工作台 | 星海小说</title>
  <meta name="description" content="管理你的创作作品和草稿">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
</head>
<body class="dashboard-page">
  <!-- Auth Gate -->
  <div class="auth-gate" id="authGate">
    <div class="auth-gate__inner">
      <div class="auth-gate__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
      </div>
      <h1>登录后可访问创作者工作台</h1>
      <p>还没有账号？立即加入我们，开始你的创作之旅</p>
      <div class="auth-gate__actions">
        <a href="/auth.html?redirect=/dashboard/" class="btn primary">登录</a>
        <a href="/auth.html?mode=signup&redirect=/dashboard/" class="btn secondary">注册</a>
      </div>
    </div>
  </div>

  <!-- Dashboard Content -->
  <div class="dashboard-content" id="dashboardContent" hidden>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/">
          <span class="brand-logo">星</span>
          星海小说
        </a>
        <nav class="primary-nav">
          <a href="/">首页</a>
          <a href="/discover/">发现</a>
          <a href="/ranking/">趋势榜</a>
          <a href="/library/">书架</a>
          <a href="/dashboard/" class="active">创作者工作台</a>
        </nav>
        <div class="search-wrap header-search" role="search">
          <input id="siteSearch" placeholder="搜索书名 / 作者 / 标签…" aria-label="搜索书籍" autocomplete="off">
          <div id="searchResults" class="results-panel" role="listbox" hidden></div>
        </div>
        <div class="header-actions" id="headerAuth"></div>
      </div>
    </header>

    <main class="dashboard-main">
      <section class="dashboard-hero">
        <div class="container">
          <h1>欢迎回来，<span id="userName">创作者</span></h1>
          <p>继续你的创作之旅</p>
        </div>
      </section>

      <section class="dashboard-stats">
        <div class="container">
          <div class="stats-grid">
            <div class="stat-card">
              <span class="stat-value" id="statReads">0</span>
              <span class="stat-label">总阅读</span>
            </div>
            <div class="stat-card">
              <span class="stat-value" id="statBookmarks">0</span>
              <span class="stat-label">总收藏</span>
            </div>
            <div class="stat-card">
              <span class="stat-value" id="statFollowers">0</span>
              <span class="stat-label">关注者</span>
            </div>
            <div class="stat-card">
              <span class="stat-value" id="statStreak">0</span>
              <span class="stat-label">连续创作</span>
            </div>
          </div>
        </div>
      </section>

      <section class="dashboard-works">
        <div class="container">
          <div class="section-header">
            <h2>我的作品</h2>
            <a href="/write/" class="btn primary">开始创作</a>
          </div>
          <div class="works-grid" id="worksGrid">
            <!-- Populated by JS -->
          </div>
        </div>
      </section>

      <section class="dashboard-drafts">
        <div class="container">
          <h2>草稿</h2>
          <div class="drafts-list" id="draftsList">
            <!-- Populated by JS -->
          </div>
        </div>
      </section>
    </main>
  </div>

  <footer class="site-footer" id="dashboardFooter" hidden>
    <div class="container footer-inner">
      <div class="footer-brand">
        <span class="brand-logo">星</span>
        <div>
          <strong>星海小说</strong>
          <p>让中文原创在温柔的光里闪耀。</p>
        </div>
      </div>
      <div class="footer-links">
        <a href="/">首页</a>
        <a href="/discover/">发现</a>
        <a href="/dashboard/">创作者中心</a>
      </div>
      <p class="footer-note">© 2024 星海小说</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/pages/dashboard.js"></script>
</body>
</html>
