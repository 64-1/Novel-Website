<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3a70ff">
  <title>发现 | 星海小说</title>
  <meta name="description" content="探索星海小说平台，发现精彩的中文原创小说">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
</head>
<body class="discover-page">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <span class="brand-logo">星</span>
        星海小说
      </a>
      <nav class="primary-nav">
        <a href="/">首页</a>
        <a href="/discover/" class="active">发现</a>
        <a href="/ranking/">趋势榜</a>
        <a href="/library/">书架</a>
        <a href="/write/">创作者工作室</a>
      </nav>
      <div class="search-wrap header-search" role="search">
        <input id="siteSearch" placeholder="搜索书名 / 作者 / 标签…" aria-label="搜索书籍" autocomplete="off">
        <div id="searchResults" class="results-panel" role="listbox" hidden></div>
      </div>
      <div class="header-actions" id="headerAuth">
        <a href="/auth.html" class="btn auth-btn login-btn">登录</a>
        <a href="/auth.html?mode=signup" class="btn primary auth-btn">注册</a>
      </div>
    </div>
  </header>

  <main class="discover-main">
    <section class="discover-hero">
      <div class="container">
        <h1>探索你的阅读宇宙</h1>
        <p>在星海小说，发现那些让你心动的故事</p>
      </div>
    </section>

    <section class="discover-content">
      <div class="container">
        <!-- Category Filters -->
        <div class="category-tabs">
          <button class="category-tab active" data-category="all">全部</button>
          <button class="category-tab" data-category="sci-fi">科幻</button>
          <button class="category-tab" data-category="fantasy">奇幻</button>
          <button class="category-tab" data-category="urban">都市</button>
          <button class="category-tab" data-category="historical">古风</button>
          <button class="category-tab" data-category="romance">言情</button>
          <button class="category-tab" data-category="mystery">悬疑</button>
        </div>

        <!-- Featured Section -->
        <div class="featured-section">
          <h2 class="section-title">编辑推荐</h2>
          <div class="featured-grid" id="featuredGrid">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- New Works -->
        <div class="new-works-section">
          <div class="section-header">
            <h2 class="section-title">新作速递</h2>
            <a href="/search?sort=newest" class="btn ghost">查看更多</a>
          </div>
          <div class="novels-grid" id="newWorksGrid">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- Collections -->
        <div class="collections-section">
          <h2 class="section-title">专题书单</h2>
          <div class="collections-grid">
            <article class="collection-card">
              <div class="collection-cover" style="background: linear-gradient(135deg, #667eea, #764ba2)">
                <span class="collection-count">12 部</span>
              </div>
              <div class="collection-info">
                <h3>星际漫游者</h3>
                <p>探索宇宙深处的好奇与孤独</p>
              </div>
            </article>
            <article class="collection-card">
              <div class="collection-cover" style="background: linear-gradient(135deg, #f093fb, #f5576c)">
                <span class="collection-count">8 部</span>
              </div>
              <div class="collection-info">
                <h3>都市迷情</h3>
                <p>霓虹灯下的爱与孤独</p>
              </div>
            </article>
            <article class="collection-card">
              <div class="collection-cover" style="background: linear-gradient(135deg, #4facfe, #00f2fe)">
                <span class="collection-count">15 部</span>
              </div>
              <div class="collection-info">
                <h3>古风探案</h3>
                <p>抽丝剥茧，还原真相</p>
              </div>
            </article>
            <article class="collection-card">
              <div class="collection-cover" style="background: linear-gradient(135deg, #43e97b, #38f9d7)">
                <span class="collection-count">10 部</span>
              </div>
              <div class="collection-info">
                <h3>治愈时光</h3>
                <p>温暖人心的日常故事</p>
              </div>
            </article>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <span class="brand-logo">星</span>
        <div>
          <strong>星海小说</strong>
          <p>让中文原创在温柔的光里闪耀。</p>
        </div>
      </div>
      <div class="footer-links">
        <a href="/">首页</a>
        <a href="/discover/">发现</a>
        <a href="/ranking/">趋势榜</a>
        <a href="/write/">创作者中心</a>
      </div>
      <p class="footer-note">© 2024 星海小说. Inspired by Pixiv Novels</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/pages/discover.js"></script>
</body>
</html>
