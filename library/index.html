<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3a70ff">
  <title>我的书架 | 星海小说</title>
  <meta name="description" content="管理你的书架和收藏">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
</head>
<body class="library-page">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <span class="brand-logo">星</span>
        星海小说
      </a>
      <nav class="primary-nav">
        <a href="/">首页</a>
        <a href="/discover/">发现</a>
        <a href="/ranking/">趋势榜</a>
        <a href="/library/" class="active">书架</a>
        <a href="/write/">创作者工作室</a>
      </nav>
      <div class="search-wrap header-search" role="search">
        <input id="siteSearch" placeholder="搜索书名 / 作者 / 标签…" aria-label="搜索书籍" autocomplete="off">
        <div id="searchResults" class="results-panel" role="listbox" hidden></div>
      </div>
      <div class="header-actions" id="headerAuth">
        <a href="/auth.html" class="btn auth-btn login-btn">登录</a>
        <a href="/auth.html?mode=signup" class="btn primary auth-btn">注册</a>
      </div>
    </div>
  </header>

  <main class="library-main">
    <section class="library-hero">
      <div class="container">
        <h1>我的书架</h1>
        <p>收藏喜欢的作品，继续上次的阅读</p>
      </div>
    </section>

    <section class="library-content">
      <div class="container">
        <div class="library-tabs">
          <button class="library-tab active" data-tab="reading">正在追读</button>
          <button class="library-tab" data-tab="bookmarks">收藏</button>
          <button class="library-tab" data-tab="completed">已读完</button>
          <button class="library-tab" data-tab="history">阅读历史</button>
        </div>

        <!-- Empty State (shown when not logged in) -->
        <div class="library-empty" id="libraryEmpty">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
            </svg>
          </div>
          <h2>登录后查看书架</h2>
          <p>登录后可收藏作品、同步阅读进度</p>
          <a href="/auth.html?redirect=/library/" class="btn primary">登录 / 注册</a>
        </div>

        <!-- Logged in content -->
        <div class="library-books" id="libraryBooks" hidden>
          <div class="books-grid" id="booksGrid">
            <!-- Populated by JS -->
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <span class="brand-logo">星</span>
        <div>
          <strong>星海小说</strong>
          <p>让中文原创在温柔的光里闪耀。</p>
        </div>
      </div>
      <div class="footer-links">
        <a href="/">首页</a>
        <a href="/discover/">发现</a>
        <a href="/ranking/">趋势榜</a>
        <a href="/write/">创作者中心</a>
      </div>
      <p class="footer-note">© 2024 星海小说. Inspired by Pixiv Novels</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/pages/library.js"></script>
</body>
</html>
