<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3a70ff">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>星海小说 · 阅读空间</title>
  <link rel="modulepreload" href="./js/pages/readerMain.js">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-logo">星</span>
        星海小说
      </a>
      <nav class="primary-nav">
        <a href="index.html">返回首页</a>
      </nav>
      <div class="header-actions">
        <button class="btn ghost" data-action="open-global-search" aria-label="搜索全书">搜索</button>
        <button class="btn ghost" data-action="toggle-theme">夜间模式</button>
      </div>
    </div>
  </header>

  <main>
    <section class="reader-lab" id="reader">
      <div class="container section-header">
        <div>
          <p class="eyebrow">阅读空间</p>
          <h2>沉浸式章节阅读</h2>
          <p class="section-subtitle">
            自适应排版、渐进式章节导航与沉浸式主题，为长篇阅读打造舒展的节奏。
          </p>
        </div>
        <div class="reader-controls-top">
          <button class="btn secondary" data-action="toggle-reader-layout">切换宽屏</button>
          <button class="btn ghost" data-action="open-reader">全屏演示</button>
        </div>
      </div>
      <div class="container reader-grid">
        <aside class="toc">
          <h4>章节目录</h4>
          <ol></ol>
          <div class="reader-stats">
            <p>已读进度</p>
            <div class="progress-bar slim" data-progress="reader" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="章节阅读进度">
              <span class="progress-fill"></span>
            </div>
            <small data-reading-time>预计剩余阅读时间：--</small>
          </div>
        </aside>
        <article class="reader-panel">
          <header class="reader-toolbar">
            <div class="toolbar-group">
              <label>字号
                <input type="range" min="16" max="24" value="18" data-action="font-size">
              </label>
              <label>行距
                <input type="range" min="1.4" max="2" step="0.1" value="1.6" data-action="line-height">
              </label>
            </div>
            <div class="toolbar-group theme-toggle">
              <button class="pill active" data-theme="day">晨光</button>
              <button class="pill" data-theme="dusk">暮色</button>
              <button class="pill" data-theme="night">星夜</button>
            </div>
            <div class="toolbar-group reader-search">
              <label class="visually-hidden" for="chap-search">搜索本章</label>
              <input id="chap-search" type="search" placeholder="搜索本章…" autocomplete="off" spellcheck="false">
              <div class="search-controls">
                <button id="chap-search-prev" type="button" aria-label="上一个命中">‹</button>
                <button id="chap-search-next" type="button" aria-label="下一个命中">›</button>
                <button id="chap-search-clear" type="button" aria-label="清除搜索">×</button>
              </div>
              <span id="chap-search-status" role="status" aria-live="polite" aria-atomic="true"></span>
            </div>
          </header>
          <div class="reader-content" data-theme="day"></div>
        </article>
      </div>
    </section>
  </main>

  <div class="reader-modal" id="reader-modal" aria-hidden="true">
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="modal-content" role="dialog" aria-modal="true" aria-label="全屏阅读模式">
      <button class="modal-close" data-action="close-modal">×</button>
      <div class="modal-progress">
        <div class="progress-bar slim" data-progress="modal" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="全屏阅读进度">
          <span class="progress-fill"></span>
        </div>
      </div>
      <div class="modal-reader">
        <aside class="modal-toc"></aside>
        <article class="modal-article"></article>
      </div>
    </div>
  </div>

  <script type="module" src="./js/pages/readerMain.js"></script>
</body>
</html>
