<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e5d6b6">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>星海小说 · 沉浸式阅读</title>
  <meta name="description" content="沉浸式阅读空间与创作工具，陪你探索原创长篇的每一次心跳。">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="星海小说">
  <meta property="og:title" content="星海小说 · 沉浸式阅读">
  <meta property="og:description" content="沉浸式阅读空间与创作工具，陪你探索原创长篇的每一次心跳。">
  <meta property="og:url" content="">
  <meta property="og:image" content="/icons/icon-512.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="星海小说 · 沉浸式阅读">
  <meta name="twitter:description" content="沉浸式阅读空间与创作工具，陪你探索原创长篇的每一次心跳。">
  <meta name="twitter:image" content="/icons/icon-512.png">
  <link rel="canonical" href="/read.html">
  <link rel="modulepreload" href="/js/main.js">
  <link rel="modulepreload" href="/js/pages/immersiveReader.js">
  <link rel="stylesheet" href="/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
</head>
<body class="immersive-reader" data-reader-theme="sepia">
  <main class="immersive-layout">
    <header class="immersive-topbar" data-layer="chrome" data-chrome-surface hidden>
      <button class="topbar-btn" type="button" data-action="back" aria-label="返回上一页">
        <span class="topbar-icon topbar-icon--back" aria-hidden="true"></span>
      </button>
      <div class="topbar-meta">
        <span class="topbar-meta__label" data-chapter-index>开始</span>
        <h1 class="topbar-meta__title" data-chapter-title>章节标题</h1>
        <p class="topbar-meta__hint" data-chapter-meta></p>
      </div>
      <button class="topbar-btn" type="button" data-action="share" aria-label="分享章节">
        <span class="topbar-icon topbar-icon--share" aria-hidden="true"></span>
      </button>
    </header>

    <section class="immersive-stage" data-stage>
      <div class="immersive-scroll" id="immersiveScroll">
        <article class="immersive-article" id="immersiveArticle"></article>
      </div>
    </section>

    <footer class="immersive-toolbar" data-layer="chrome" data-chrome-surface hidden>
      <div class="toolbar-row toolbar-row--nav">
        <button class="toolbar-btn" type="button" data-action="prev-chapter">上一章</button>
        <div class="progress-group">
          <div class="immersive-progress" data-progress="immersive" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="阅读进度">
            <span class="progress-track"></span>
            <span class="progress-fill"></span>
          </div>
          <span class="progress-label" data-progress-label>0%</span>
        </div>
        <button class="toolbar-btn" type="button" data-action="next-chapter">下一章</button>
      </div>
      <div class="toolbar-row toolbar-row--settings">
        <div class="theme-group">
          <button class="theme-pill active" type="button" data-reader-theme="sepia">纸感</button>
          <button class="theme-pill" type="button" data-reader-theme="day">晨光</button>
          <button class="theme-pill" type="button" data-reader-theme="night">夜间</button>
        </div>
        <div class="slider-group">
          <label for="fontSizeControl">字号</label>
          <input id="fontSizeControl" type="range" min="17" max="24" value="20" step="1" data-action="font-size">
          <span class="slider-value" data-font-size-display>20px</span>
        </div>
      </div>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/pages/immersiveReader.js"></script>
</body>
</html>
