<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e5d6b6">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <title>星海小说 · 沉浸式阅读</title>
  <meta name="description" content="沉浸式阅读空间与创作工具，陪你探索原创长篇的每一次心跳。">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="星海小说">
  <meta property="og:title" content="星海小说 · 沉浸式阅读">
  <meta property="og:description" content="沉浸式阅读空间与创作工具，陪你探索原创长篇的每一次心跳。">
  <meta property="og:url" content="">
  <meta property="og:image" content="/icons/icon-512.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="星海小说 · 沉浸式阅读">
  <meta name="twitter:description" content="沉浸式阅读空间与创作工具，陪你探索原创长篇的每一次心跳。">
  <meta name="twitter:image" content="/icons/icon-512.png">
  <link rel="canonical" href="/read.html">
  <link rel="modulepreload" href="/js/main.js">
  <link rel="modulepreload" href="/js/pages/immersiveReader.js">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
</head>
<body class="immersive-reader" data-reader-theme="sepia">
  <main class="immersive-layout">
    <header class="immersive-topbar" data-layer="chrome" data-chrome-surface hidden>
      <button class="topbar-btn" type="button" data-action="back" aria-label="返回上一页">
        <span class="topbar-icon topbar-icon--back" aria-hidden="true"></span>
      </button>
      <div class="topbar-meta">
        <span class="topbar-meta__label" data-chapter-index>开始</span>
        <h1 class="topbar-meta__title" data-chapter-title>章节标题</h1>
        <p class="topbar-meta__hint" data-chapter-meta></p>
      </div>
      <button class="topbar-btn" type="button" data-action="share" aria-label="分享章节">
        <span class="topbar-icon topbar-icon--share" aria-hidden="true"></span>
      </button>
    </header>

    <section class="immersive-stage" data-stage>
      <div class="immersive-scroll" id="immersiveScroll">
        <article class="immersive-article" id="immersiveArticle"></article>
      </div>
      <div class="highlight-popover" id="highlightPopover" role="toolbar" aria-hidden="true">
        <button class="highlight-swatch highlight-swatch--ylw" type="button" data-color="ylw" aria-label="琥珀高亮"></button>
        <button class="highlight-swatch highlight-swatch--grn" type="button" data-color="grn" aria-label="松柏高亮"></button>
        <button class="highlight-swatch highlight-swatch--blu" type="button" data-color="blu" aria-label="雾蓝高亮"></button>
        <button class="highlight-swatch highlight-swatch--pnk" type="button" data-color="pnk" aria-label="烟粉高亮"></button>
      </div>
      <div class="codex-popover" id="codexPopover" role="dialog" aria-hidden="true">
        <div class="codex-popover__inner">
          <button class="codex-popover__close" type="button" data-action="close-codex" aria-label="关闭世界观卡片">×</button>
          <span class="codex-popover__badge" data-codex-tag></span>
          <h3 class="codex-popover__title" data-codex-title></h3>
          <p class="codex-popover__summary" data-codex-summary></p>
          <ul class="codex-popover__details" data-codex-details></ul>
          <ul class="codex-popover__timeline" data-codex-timeline></ul>
          <div class="codex-popover__tags" data-codex-tags></div>
        </div>
      </div>
    </section>

    <footer class="immersive-toolbar" data-layer="chrome" data-chrome-surface hidden>
      <div class="toolbar-row toolbar-row--nav">
        <button class="nav-pill nav-pill--prev" type="button" data-action="prev-chapter" title="上一章（快捷键 ←）">
          <span class="nav-pill__icon" aria-hidden="true"></span>
          <span class="nav-pill__text">上一章</span>
          <span class="nav-pill__hint" aria-hidden="true">←</span>
        </button>
        <div class="progress-cluster">
          <div class="immersive-progress" data-progress="immersive" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="阅读进度">
            <span class="progress-track"></span>
            <span class="progress-fill"></span>
          </div>
          <div class="progress-meta">
            <span class="progress-label" data-progress-label>0%</span>
            <span class="progress-hint">小提示：使用 ← → 快速换章 · 双击正文就能加书签</span>
          </div>
        </div>
        <button class="nav-pill nav-pill--next" type="button" data-action="next-chapter" title="下一章（快捷键 →）">
          <span class="nav-pill__text">下一章</span>
          <span class="nav-pill__hint" aria-hidden="true">→</span>
          <span class="nav-pill__icon" aria-hidden="true"></span>
        </button>
      </div>
      <div class="reader-quickbar" role="group" aria-label="快速操作">
        <button class="quick-item" type="button" data-quick="toc" data-action="toggle-annotations" aria-controls="annotationDrawerPanel" aria-expanded="false">
          <span class="quick-item__icon quick-item__icon--toc" aria-hidden="true"></span>
          <span class="quick-item__label">目录</span>
          <span class="toolbar-badge" data-annotation-count hidden>0</span>
        </button>
        <button class="quick-item" type="button" data-quick="font">
          <span class="quick-item__icon quick-item__icon--font" aria-hidden="true"></span>
          <span class="quick-item__label">字号</span>
        </button>
        <button class="quick-item" type="button" data-quick="theme">
          <span class="quick-item__icon quick-item__icon--night" aria-hidden="true"></span>
          <span class="quick-item__label">夜间</span>
        </button>
        <button class="quick-item" type="button" data-quick="settings" aria-controls="readerSettingsPanel" aria-expanded="false">
          <span class="quick-item__icon quick-item__icon--settings" aria-hidden="true"></span>
          <span class="quick-item__label">设置</span>
        </button>
      </div>
    </footer>
  </main>

  <aside class="annotations-drawer" id="annotationDrawer" aria-hidden="true">
    <div class="annotations-drawer__backdrop" data-action="close-annotations"></div>
    <div
      class="annotations-drawer__panel"
      id="annotationDrawerPanel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="annotationDrawerTitle"
      tabindex="-1"
    >
      <header class="annotations-drawer__header">
        <div>
          <h2 id="annotationDrawerTitle">标注</h2>
          <p class="annotations-drawer__subtitle">高亮与书签都会在这里集中管理</p>
        </div>
        <div class="annotations-drawer__actions">
          <button class="annotations-drawer__bookmark" type="button" data-action="drawer-add-bookmark" aria-label="添加书签">＋</button>
          <button class="annotations-drawer__close" type="button" data-action="close-annotations" aria-label="关闭标注面板">×</button>
        </div>
      </header>
      <div class="annotations-drawer__tabs" role="tablist">
        <button class="drawer-tab active" type="button" role="tab" aria-selected="true" data-annotation-tab="highlights">
          高亮
          <span class="drawer-tab__count" data-count="highlights">0</span>
        </button>
        <button class="drawer-tab" type="button" role="tab" aria-selected="false" data-annotation-tab="bookmarks">
          书签
          <span class="drawer-tab__count" data-count="bookmarks">0</span>
        </button>
        <button class="drawer-tab" type="button" role="tab" aria-selected="false" data-annotation-tab="codex">
          世界观
          <span class="drawer-tab__count" data-count="codex">0</span>
        </button>
        <button class="drawer-tab" type="button" role="tab" aria-selected="false" data-annotation-tab="toc">
          目录
        </button>
      </div>
      <div class="annotations-drawer__body" id="annotationList" role="list"></div>
    </div>
  </aside>

  <div class="immersive-toast" id="immersiveToast" aria-live="polite" aria-hidden="true"></div>

  <aside class="reader-settings" id="readerSettings" aria-hidden="true">
    <div class="reader-settings__backdrop" data-action="close-settings"></div>
    <div class="reader-settings__panel" id="readerSettingsPanel" role="dialog" aria-modal="true" aria-labelledby="readerSettingsTitle" tabindex="-1">
      <header class="reader-settings__header">
        <div>
          <h2 id="readerSettingsTitle">阅读设置</h2>
          <p class="reader-settings__subtitle">调整字体与背景，找到最合适的阅读氛围</p>
        </div>
        <button class="reader-settings__close" type="button" data-action="close-settings" aria-label="关闭设置面板">×</button>
      </header>
      <section class="reader-settings__section">
        <div class="settings-row">
          <span class="settings-label">字号</span>
          <div class="settings-slider">
            <button class="settings-icon-btn" type="button" data-action="font-smaller" aria-label="减小字号">A−</button>
            <input id="settingsFontSize" type="range" min="16" max="28" value="20" step="1">
            <button class="settings-icon-btn" type="button" data-action="font-larger" aria-label="增大字号">A+</button>
            <span class="settings-value" data-settings-font-display>20px</span>
          </div>
        </div>
        <div class="settings-row">
          <span class="settings-label">行距</span>
          <div class="settings-lineheight">
            <button class="pill-btn" type="button" data-line-height="1.6">舒缓</button>
            <button class="pill-btn" type="button" data-line-height="1.8" aria-pressed="true">标准</button>
            <button class="pill-btn" type="button" data-line-height="2.0">宽松</button>
          </div>
        </div>
      </section>
      <section class="reader-settings__section">
        <span class="settings-label">背景</span>
        <div class="settings-swatches" role="list">
          <button class="swatch" type="button" data-theme="sepia" aria-label="纸感" aria-pressed="true"><span style="background:#f4e7d0"></span></button>
          <button class="swatch" type="button" data-theme="day" aria-label="晨光"><span style="background:#f0f4ff"></span></button>
          <button class="swatch" type="button" data-theme="night" aria-label="夜间"><span style="background:#141926"></span></button>
          <button class="swatch" type="button" data-theme="ink" aria-label="墨青"><span style="background:#101a2a"></span></button>
          <button class="swatch" type="button" data-theme="mint" aria-label="雾绿"><span style="background:#d7eee2"></span></button>
        </div>
      </section>
      <section class="reader-settings__section">
        <span class="settings-label">字体</span>
        <div class="settings-fonts">
          <button class="pill-btn" type="button" data-font="serif" aria-pressed="true">仿宋</button>
          <button class="pill-btn" type="button" data-font="sans">简洁</button>
        </div>
      </section>
    </div>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/pages/immersiveReader.js"></script>
</body>
</html>
