<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3a70ff">
  <title>账户设置 | 星海小说</title>
  <meta name="description" content="管理你的账户设置">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
</head>
<body class="settings-page">
  <!-- Auth Gate -->
  <div class="auth-gate" id="authGate">
    <div class="auth-gate__inner">
      <div class="auth-gate__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
      </div>
      <h1>登录后可访问设置</h1>
      <p>请先登录你的账户</p>
      <div class="auth-gate__actions">
        <a href="/auth.html?redirect=/settings/" class="btn primary">登录</a>
      </div>
    </div>
  </div>

  <!-- Settings Content -->
  <div class="settings-content" id="settingsContent" hidden>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/">
          <span class="brand-logo">星</span>
          星海小说
        </a>
        <nav class="primary-nav">
          <a href="/">首页</a>
          <a href="/discover/">发现</a>
          <a href="/library/">书架</a>
          <a href="/dashboard/">创作者工作台</a>
        </nav>
        <div class="header-actions" id="headerAuth"></div>
      </div>
    </header>

    <main class="settings-main">
      <div class="container">
        <div class="settings-layout">
          <!-- Sidebar -->
          <aside class="settings-sidebar">
            <nav class="settings-nav">
              <a href="#profile" class="settings-nav__item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
                个人资料
              </a>
              <a href="#account" class="settings-nav__item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                账户安全
              </a>
              <a href="#preferences" class="settings-nav__item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="3"/>
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                阅读偏好
              </a>
              <a href="#notifications" class="settings-nav__item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                  <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                通知设置
              </a>
            </nav>
          </aside>

          <!-- Main Content -->
          <div class="settings-panel">
            <!-- Profile Section -->
            <section id="profile" class="settings-section active">
              <h2>个人资料</h2>
              <form class="settings-form" id="profileForm">
                <div class="form-group">
                  <label>头像</label>
                  <div class="avatar-upload">
                    <img id="avatarPreview" src="" alt="头像预览">
                    <button type="button" class="btn ghost">更换头像</button>
                  </div>
                </div>
                <div class="form-group">
                  <label for="displayName">显示名称</label>
                  <input type="text" id="displayName" class="form-input" placeholder="你的昵称">
                </div>
                <div class="form-group">
                  <label for="bio">个人简介</label>
                  <textarea id="bio" class="form-input" rows="4" placeholder="介绍一下自己…"></textarea>
                </div>
                <div class="form-group">
                  <label for="location">所在地</label>
                  <input type="text" id="location" class="form-input" placeholder="所在城市">
                </div>
                <div class="form-group">
                  <label for="website">个人网站</label>
                  <input type="url" id="website" class="form-input" placeholder="https://">
                </div>
                <div class="form-actions">
                  <button type="submit" class="btn primary">保存更改</button>
                </div>
              </form>
            </section>

            <!-- Account Section -->
            <section id="account" class="settings-section">
              <h2>账户安全</h2>
              <form class="settings-form" id="accountForm">
                <div class="form-group">
                  <label for="email">邮箱地址</label>
                  <input type="email" id="email" class="form-input" placeholder="your@email.com" disabled>
                  <span class="form-hint">邮箱用于登录和找回密码</span>
                </div>
                <div class="form-group">
                  <label for="currentPassword">当前密码</label>
                  <input type="password" id="currentPassword" class="form-input" placeholder="输入当前密码">
                </div>
                <div class="form-group">
                  <label for="newPassword">新密码</label>
                  <input type="password" id="newPassword" class="form-input" placeholder="输入新密码">
                </div>
                <div class="form-group">
                  <label for="confirmPassword">确认新密码</label>
                  <input type="password" id="confirmPassword" class="form-input" placeholder="再次输入新密码">
                </div>
                <div class="form-actions">
                  <button type="submit" class="btn primary">更新密码</button>
                </div>
              </form>
            </section>

            <!-- Preferences Section -->
            <section id="preferences" class="settings-section">
              <h2>阅读偏好</h2>
              <form class="settings-form" id="preferencesForm">
                <div class="form-group">
                  <label>默认阅读主题</label>
                  <div class="theme-options">
                    <label class="theme-option">
                      <input type="radio" name="theme" value="sepia" checked>
                      <span class="theme-swatch" style="background: #f4e7d0"></span>
                      纸感
                    </label>
                    <label class="theme-option">
                      <input type="radio" name="theme" value="day">
                      <span class="theme-swatch" style="background: #f0f4ff"></span>
                      晨光
                    </label>
                    <label class="theme-option">
                      <input type="radio" name="theme" value="night">
                      <span class="theme-swatch" style="background: #141926"></span>
                      星夜
                    </label>
                  </div>
                </div>
                <div class="form-group">
                  <label for="fontSize">默认字号</label>
                  <input type="range" id="fontSize" min="16" max="28" value="20" class="form-range">
                  <span class="range-value">20px</span>
                </div>
                <div class="form-actions">
                  <button type="submit" class="btn primary">保存偏好</button>
                </div>
              </form>
            </section>

            <!-- Notifications Section -->
            <section id="notifications" class="settings-section">
              <h2>通知设置</h2>
              <form class="settings-form" id="notificationsForm">
                <div class="form-group">
                  <label class="toggle-label">
                    <input type="checkbox" name="emailNotifications" checked>
                    <span class="toggle-switch"></span>
                    邮件通知
                  </label>
                  <p class="form-hint">接收新作更新、关注者动态等邮件通知</p>
                </div>
                <div class="form-group">
                  <label class="toggle-label">
                    <input type="checkbox" name="pushNotifications" checked>
                    <span class="toggle-switch"></span>
                    推送通知
                  </label>
                  <p class="form-hint">接收浏览器推送通知</p>
                </div>
                <div class="form-group">
                  <label class="toggle-label">
                    <input type="checkbox" name="followNotifications" checked>
                    <span class="toggle-switch"></span>
                    关注通知
                  </label>
                  <p class="form-hint">有人关注或收藏你的作品时通知</p>
                </div>
                <div class="form-actions">
                  <button type="submit" class="btn primary">保存设置</button>
                </div>
              </form>
            </section>
          </div>
        </div>
      </div>
    </main>
  </div>

  <footer class="site-footer" id="settingsFooter" hidden>
    <div class="container footer-inner">
      <div class="footer-brand">
        <span class="brand-logo">星</span>
        <div>
          <strong>星海小说</strong>
          <p>让中文原创在温柔的光里闪耀。</p>
        </div>
      </div>
      <p class="footer-note">© 2024 星海小说</p>
    </div>
  </footer>

  <script type="module" src="/js/pages/settings.js"></script>
</body>
</html>
