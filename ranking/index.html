<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3a70ff">
  <title>趋势榜 | 星海小说</title>
  <meta name="description" content="星海小说热门作品排行榜，发现最多人追读的故事">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
</head>
<body class="ranking-page">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <span class="brand-logo">星</span>
        星海小说
      </a>
      <nav class="primary-nav">
        <a href="/">首页</a>
        <a href="/discover/">发现</a>
        <a href="/ranking/" class="active">趋势榜</a>
        <a href="/library/">书架</a>
        <a href="/write/">创作者工作室</a>
      </nav>
      <div class="search-wrap header-search" role="search">
        <input id="siteSearch" placeholder="搜索书名 / 作者 / 标签…" aria-label="搜索书籍" autocomplete="off">
        <div id="searchResults" class="results-panel" role="listbox" hidden></div>
      </div>
      <div class="header-actions" id="headerAuth">
        <a href="/auth.html" class="btn auth-btn login-btn">登录</a>
        <a href="/auth.html?mode=signup" class="btn primary auth-btn">注册</a>
      </div>
    </div>
  </header>

  <main class="ranking-main">
    <section class="ranking-hero">
      <div class="container">
        <h1>趋势榜</h1>
        <p>实时热门，最受读者追读的作品</p>
      </div>
    </section>

    <section class="ranking-content">
      <div class="container">
        <div class="ranking-tabs">
          <button class="ranking-tab active" data-period="day">日榜</button>
          <button class="ranking-tab" data-period="week">周榜</button>
          <button class="ranking-tab" data-period="month">月榜</button>
          <button class="ranking-tab" data-period="all">总榜</button>
        </div>

        <div class="ranking-list" id="rankingList">
          <!-- Populated by JS -->
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <span class="brand-logo">星</span>
        <div>
          <strong>星海小说</strong>
          <p>让中文原创在温柔的光里闪耀。</p>
        </div>
      </div>
      <div class="footer-links">
        <a href="/">首页</a>
        <a href="/discover/">发现</a>
        <a href="/ranking/">趋势榜</a>
        <a href="/write/">创作者中心</a>
      </div>
      <p class="footer-note">© 2024 星海小说. Inspired by Pixiv Novels</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/pages/ranking.js"></script>
</body>
</html>
